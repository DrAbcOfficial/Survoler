name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Android workload
        run: dotnet workload restore Survoler.Android/Survoler.Android.csproj

      - name: Restore projects
        run: dotnet restore Survoler.Tests/Survoler.Tests.csproj

      - name: Run tests
        run: dotnet test Survoler.Tests/Survoler.Tests.csproj --configuration Release --no-restore

      - name: Build Android APK
        run: dotnet build Survoler.Android/Survoler.Android.csproj --configuration Release --no-restore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: survoler-apk
          path: Survoler.Android/bin/Release/net10.0-android36.0/android-arm64/net.drabc.survoler-Signed.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          Survoler.Android/bin/Release/net10.0-android36.0/android-arm64/net.drabc.survoler-Signed.apk
          --title "Survoler $GITHUB_REF_NAME"
          --generate-notes
