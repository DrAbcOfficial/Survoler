name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set release version from tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]{0,2}|1[0-9]{3}|20[0-9]{2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]; then
            echo '::error::Release tags must be canonical vX.Y.Z: major 0..2099, minor/patch 0..999, no leading zeros.'
            exit 1
          fi
          printf 'ReleaseVersion=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.400

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install test rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libfontconfig1 fontconfig fonts-dejavu-core fonts-noto-cjk
          fc-cache -f

      - name: Restore Android workload
        run: dotnet workload restore Survoler.Android/Survoler.Android.csproj

      - name: Restore projects
        run: dotnet restore Survoler.slnx

      - name: Verify version properties
        shell: pwsh
        run: ./build/Verify-Version.ps1

      - name: Run tests
        run: dotnet test Survoler.Tests/Survoler.Tests.csproj --configuration Release --no-restore

      - name: Build Android APK
        run: dotnet build Survoler.Android/Survoler.Android.csproj --configuration Release --no-restore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: survoler-apk
          path: Survoler.Android/bin/Release/net10.0-android36.0/android-arm64/net.drabc.survoler-Signed.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          Survoler.Android/bin/Release/net10.0-android36.0/android-arm64/net.drabc.survoler-Signed.apk
          --title "Survoler $GITHUB_REF_NAME"
          --generate-notes
